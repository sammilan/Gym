<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Strong at 43">
<meta name="theme-color" content="#0c0c0c">
<title>Strong at 43</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--surface:#161616;--border:#282828;--gold:#d4a843;--red:#e05252;--green:#4caf82;--blue:#5b8fd4;--purple:#9b72d4;--text:#ede8df;--muted:#666;--muted2:#444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;display:none;padding-bottom:84px;-webkit-overflow-scrolling:touch}
.screen.active{display:block}
.mono{font-family:'DM Mono',monospace}
.bebas{font-family:'Bebas Neue',sans-serif}
.nav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 2px 14px;gap:4px;cursor:pointer;border:none;background:none;color:var(--muted);font-family:inherit}
.nav-btn.active{color:var(--gold)}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:8px;letter-spacing:1px;text-transform:uppercase;font-family:'DM Mono',monospace}
.hdr{padding:28px 20px 16px;border-bottom:1px solid var(--border)}
.hdr-grad{background:linear-gradient(180deg,#1a1200 0%,var(--bg) 100%)}
.hdr-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;line-height:.95}
.hdr-title.sm{font-size:32px}
.hdr-sub{font-size:12px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);margin:16px 20px;border:1px solid var(--border)}
.stat{background:var(--surface);padding:14px 8px;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);line-height:1}
.stat-l{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.sec{padding:8px 20px 4px}
.sec-t{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.card{margin:0 20px 10px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--gold)}
.card-h{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start}
.card-tag{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase}
.card-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-top:2px}
.card-meta{font-size:11px;color:var(--muted)}
.btn-gold{background:var(--gold);color:#000;border:none;padding:8px 14px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:500;cursor:pointer;border-radius:2px;white-space:nowrap}
.card-ex{padding:0 16px 12px}
.card-ex-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.card-ex-row .m{font-family:'DM Mono',monospace;color:var(--muted)}
.flag{margin:0 20px 8px;background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.2);padding:12px 14px;display:flex;gap:10px}
.flag-n{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--red);line-height:1;flex-shrink:0}
.flag-t{font-family:'DM Mono',monospace;font-size:10px;color:var(--red);letter-spacing:1px;margin-bottom:3px}
.flag-b{font-size:12px;line-height:1.5}
.pstrip{display:flex;height:5px;margin:12px 20px;gap:1px}
.pblock{margin:0 20px 6px;border:1px solid var(--border);background:var(--surface);overflow:hidden}
.pbtn{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:none;color:var(--text);cursor:pointer;text-align:left;border-left:3px solid transparent}
.pnum{font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;width:28px;flex-shrink:0}
.pname{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px}
.pdur{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.ptag{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border-radius:2px}
.pchev{color:var(--muted);transition:transform .3s;font-size:12px}
.pblock.open .pchev{transform:rotate(180deg)}
.pbody{display:none;border-top:1px solid var(--border)}
.pblock.open .pbody{display:block}
.pgoal{padding:10px 16px;font-size:12px;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--border)}
.pgoal strong{color:var(--text)}
.wtbl{width:100%;border-collapse:collapse;font-size:11px}
.wtbl-wrap{overflow-x:auto}
.wtbl th{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
.wtbl td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px}
.wtbl td:first-child{font-family:'DM Mono',monospace;color:var(--gold);font-size:10px}
.wtbl tr.deload td{background:rgba(255,255,255,.02)}
.wtbl tr.deload td:first-child{color:var(--muted)}
.pmile{padding:10px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.pmile strong{color:var(--text)}
.filt{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--border)}
.filt::-webkit-scrollbar{display:none}
.fbtn{padding:6px 14px;border:1px solid var(--border);background:none;color:var(--muted);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap}
.fbtn.active{background:rgba(212,168,67,.12);border-color:var(--gold);color:var(--gold)}
.exc{margin:8px 16px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.exc-h{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
.exc-badge{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.exc-name{font-size:14px;font-weight:500}
.exc-cat{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.exc-chev{color:var(--muted);font-size:12px;transition:transform .3s}
.exc.open .exc-chev{transform:rotate(180deg)}
.exc-d{display:none;border-top:1px solid var(--border)}
.exc.open .exc-d{display:block}
.exc-tabs{display:flex;border-bottom:1px solid var(--border)}
.exc-tab{flex:1;padding:10px 4px;text-align:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent}
.exc-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.exc-c{padding:14px 16px;display:none}
.exc-c.active{display:block}
.fitem{display:flex;gap:8px;margin-bottom:8px;font-size:12px;line-height:1.5}
.fitem .arr{color:var(--gold);flex-shrink:0;font-size:11px}
.fitem .x{color:var(--red);flex-shrink:0}
.fitem .w{color:var(--red);flex-shrink:0}
.inj-t{font-family:'DM Mono',monospace;font-size:9px;color:var(--red);letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px}
.pgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pcell{flex:1 1 70px;background:var(--bg);border:1px solid var(--border);padding:8px 4px;text-align:center}
.pcell-l{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted)}
.pcell-v{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);line-height:1.1;margin-top:2px}
.rule{font-size:11px;color:var(--muted);padding:10px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.rule strong{color:var(--text)}
.vid{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);text-decoration:none;color:var(--text);margin-bottom:8px;border-radius:2px}
.vid-th{width:40px;height:28px;background:#ff0000;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.vid-t{font-size:11px;font-weight:500;line-height:1.3}
.vid-c{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-top:2px}
.prefill{margin:12px 16px 4px;padding:10px;background:none;border:1px dashed var(--gold);color:var(--gold);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;width:calc(100% - 32px);border-radius:2px}
.logex{margin:8px 16px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.logex-h{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logex-n{font-size:13px;font-weight:500}
.logex-t{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold)}
.sug{padding:6px 16px;font-size:10px;font-family:'DM Mono',monospace;border-bottom:1px solid var(--border)}
.logsets{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:8px}
.setn{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:36px;flex-shrink:0}
.inp{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;font-size:13px;text-align:center;border-radius:2px;font-family:inherit;min-width:0}
.inp:focus{outline:none;border-color:var(--gold)}
.chk{width:32px;height:32px;border:1px solid var(--border);background:none;color:var(--muted);border-radius:2px;cursor:pointer;font-size:14px;flex-shrink:0}
.chk.done{background:rgba(76,175,130,.12);border-color:var(--green);color:var(--green)}
.savebtn{margin:16px 16px 8px;padding:14px;background:var(--gold);color:#000;border:none;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:500;cursor:pointer;width:calc(100% - 32px);border-radius:2px}
.hist{margin:0 16px 8px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hist-n{font-size:12px;font-weight:500}
.hist-d{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.hist-b{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;background:rgba(76,175,130,.12);color:var(--green);border-radius:2px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;display:none;flex-direction:column;max-width:430px;margin:0 auto}
.modal.open{display:flex}
.modal-h{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-t{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px}
.modal-close{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;border-radius:2px}
.modal-b{flex:1;overflow-y:auto;padding:16px}
.modal-en{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;margin-bottom:4px}
.modal-et{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold)}
.timer-t{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.timer-bar{height:4px;background:var(--border);border-radius:2px}
.timer-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 1s linear}
.msetrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.msetn{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);width:40px}
.minp{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px;font-size:14px;text-align:center;border-radius:2px;font-family:inherit;min-width:0}
.minp:focus{outline:none;border-color:var(--gold)}
.mchk{width:40px;height:40px;border:1px solid var(--border);background:none;color:var(--muted);font-size:16px;border-radius:2px;cursor:pointer;flex-shrink:0}
.mchk.done{background:rgba(76,175,130,.12);border-color:var(--green);color:var(--green)}
.mnav{display:flex;gap:8px;margin-top:16px}
.mnav-btn{flex:1;padding:12px;border:1px solid var(--border);background:none;color:var(--text);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px}
.mnav-btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:500}
.mnav-btn.green{background:var(--green);border-color:var(--green);color:#000;font-weight:500}
.sound-btn{position:absolute;top:12px;right:12px;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 9px;font-size:11px;cursor:pointer;font-family:'DM Mono',monospace}
.bodystat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);margin:16px 20px;border:1px solid var(--border)}
.bodybox{background:var(--surface);padding:14px 8px;text-align:center}
.bodyv{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1}
.bodyl{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.chartbox{margin:0 20px 16px;padding:16px;background:var(--surface);border:1px solid var(--border)}
.chart-t{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
.logbox{margin:0 20px 16px;padding:16px;background:var(--surface);border:1px solid var(--gold)}
.logbox-t{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.empty{padding:16px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>

<script>
const GOLD="#d4a843",RED="#e05252",GREEN="#4caf82",BLUE="#5b8fd4",PURPLE="#9b72d4";
const sessions={
upperA:{name:"Upper A — Push",day:"Monday",exercises:[{name:"Incline DB Press",target:"3×10",sets:3,reps:10},{name:"Seated Cable Row",target:"3×12",sets:3,reps:12},{name:"DB Shoulder Press",target:"2×10",sets:2,reps:10},{name:"Face Pulls",target:"3×15",sets:3,reps:15},{name:"Cable Tricep Pushdown",target:"2×12",sets:2,reps:12}]},
lowerA:{name:"Lower A — Quad",day:"Tuesday",exercises:[{name:"Leg Press (shallow ROM)",target:"3×12",sets:3,reps:12},{name:"Goblet Squat (heels elevated)",target:"3×10",sets:3,reps:10},{name:"Lying Leg Curl",target:"3×12",sets:3,reps:12},{name:"Calf Raise",target:"2×15",sets:2,reps:15},{name:"Dead Bug",target:"2×8/side",sets:2,reps:8}]},
upperB:{name:"Upper B — Pull",day:"Thursday",exercises:[{name:"Lat Pulldown",target:"3×12",sets:3,reps:12},{name:"DB Bench Press",target:"3×10",sets:3,reps:10},{name:"Cable Lateral Raise",target:"2×12",sets:2,reps:12},{name:"DB Curl",target:"2×12",sets:2,reps:12},{name:"Face Pulls",target:"3×15",sets:3,reps:15}]},
lowerB:{name:"Lower B — Hinge",day:"Friday",exercises:[{name:"Rack Pull (below knee)",target:"3×6",sets:3,reps:6},{name:"Step-Up (low box)",target:"3×10/leg",sets:3,reps:10},{name:"Leg Press (shallow ROM)",target:"2×12",sets:2,reps:12},{name:"Seated Leg Curl",target:"2×12",sets:2,reps:12},{name:"Plank",target:"2×30s",sets:2,reps:30}]}
};
const ED={
"Incline DB Press":{cat:"push",emoji:"🏋️",inc:2,form:["Set bench to 30–45°. Higher shifts work to shoulders, not chest.","Sit on edge, DBs on thighs, kick them up as you lie back.","Feet flat. Squeeze shoulder blades together and down.","Lower DBs slowly (3 sec) until elbows at 90°.","DBs track 45–75° from torso — not flared 90° (shoulder killer).","Press up, slightly inward. Exhale pressing, inhale lowering."],donts:["Elbows flared 90° — destroys rotator cuff.","Bouncing DBs off chest.","Butt rising off bench — reduce weight.","Too heavy too soon — tendons need weeks."],injury:["Tight back: feet flat, slight natural arch only.","Shoulder pinch? Narrow elbow angle."],prog:[["W1–2","8kg","3×10"],["W3–4","10kg","3×10"],["W5–6","12kg","3×10"],["W7","14kg","3×8"],["W8","DELOAD","8kg"]],videos:[{t:"Incline DB Press: 3 Golden Rules",c:"ATHLEAN-X",u:"https://www.youtube.com/watch?v=hChjZQhX1Ls"},{t:"Incline DB Press — 2 Min",c:"2 Minute Tutorials",u:"https://www.youtube.com/watch?v=IP4oeKh1Sd4"}]},
"Seated Cable Row":{cat:"pull",emoji:"🚣",inc:2.5,form:["Sit upright, feet on pads, slight knee bend. Back straight.","Close-grip attachment. Arms extended, slight lat stretch.","Pull to lower sternum — not belly.","Lead with elbows, pull back past torso. Squeeze blades.","Hold 1 sec. Extend arms slowly (3 sec)."],donts:["Rocking back and forth — stay upright.","Shrugging shoulders.","Pulling to belly.","Momentum/too heavy."],injury:["Feel lower back? Sit more upright.","Start light. Don't swing."],prog:[["W1–2","20kg","3×12"],["W3–4","25kg","3×12"],["W5–6","30kg","3×10"],["W7","35kg","3×10"],["W8","DELOAD","20kg"]],videos:[{t:"How To: Seated Cable Row",c:"ScottHermanFitness",u:"https://www.youtube.com/watch?v=sP_4vybjVJs"}]},
"Face Pulls":{cat:"pull",emoji:"💪",inc:1,form:["Fixes rounded shoulders from desk work. Non-negotiable.","Cable at face height. ROPE attachment.","Step back, arms extended, light tension.","Pull rope toward face, separating the ends.","Hands finish at ear level, elbows up & out.","Hold 1 sec, feel rear delts. Return slow."],donts:["Pulling toward neck/chin.","Elbows dropping.","Going heavy — light & perfect.","Not separating rope ends."],injury:[],prog:[["W1–2","10kg","3×15"],["W3–8","12–15kg","3×15"]],videos:[{t:"How To Do Cable Face Pulls",c:"PureGym",u:"https://www.youtube.com/watch?v=0Po47vvj9g4"}]},
"Rack Pull (below knee)":{cat:"legs",emoji:"🏗️",inc:5,form:["Bar below knees on pins. Protects lower back.","For 8 weeks this IS your deadlift. No floor pulls until Phase 2.","Bar over mid-foot, shoulder-width.","Hinge at hips, grip just outside legs.","Big breath, brace core hard.","Pull slack out first (click), drive through heels.","Hips & shoulders rise together. Lock out tall.","Lower under control. Reset each rep."],donts:["Rounding lower back — too heavy.","Jerking the bar.","Hips shooting up first.","Hyperextending at lockout.","Craning neck up.","Holding breath multiple reps."],injury:["Any back pain → reduce 20% now.","Never train through back pain."],prog:[["W1–2","Bar","3×6"],["W3–4","40kg","3×6"],["W5–6","55kg","3×6"],["W7","65kg","3×5"],["W8","DELOAD","30kg"]],videos:[{t:"The Rack Pull — Untamed Special",c:"Alan Thrall",u:"https://www.youtube.com/watch?v=jfSxbT-65ow"},{t:"How To Deadlift (Full)",c:"Alan Thrall",u:"https://www.youtube.com/watch?v=wYREQkVtvEc"}]},
"Goblet Squat (heels elevated)":{cat:"legs",emoji:"🏋️",inc:2,form:["Weight in front = less knee stress.","Heels on 5kg plates — protects knee.","Hold one DB vertically at chest.","Feet shoulder-width, toes out 30°.","Descend pushing knees OUT, sit back & down.","ONLY as low as pain-free. Stop if knee hurts.","Chest tall. Drive up through heels."],donts:["Knees caving in.","Going past pain.","Heels rising off plates."],injury:["Primary quad move for your knee.","Pain weekly? Reduce depth, tell physio."],prog:[["W1–2","8kg","3×10"],["W3–4","12kg","3×10"],["W5–8","16kg","3×10"]],videos:[{t:"How To: Goblet Squat",c:"ScottHermanFitness",u:"https://www.youtube.com/watch?v=MeIiIdhvXT4"}]},

h+=`</div>`;
const ww=S.bodyLog.filter(b=>b.waist);
if(ww.length){h+=`<div class="chartbox"><div class="chart-t">Waist (cm) — flat-tummy metric</div>${ww.slice(-6).map(b=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px"><span class="mono" style="color:#666;font-size:10px">${b.date}</span><span style="color:${BLUE}">${b.waist} cm</span></div>`).join("")}</div>`;}
h+=`<div class="logbox"><div class="logbox-t">+ Log Today</div><div style="display:flex;gap:8px;margin-bottom:10px"><input class="inp" id="wIn" type="number" inputmode="decimal" placeholder="Weight kg" style="padding:12px"><input class="inp" id="waistIn" type="number" inputmode="decimal" placeholder="Waist cm (opt)" style="padding:12px"></div><button class="btn-gold" style="width:100%;padding:12px" onclick="addBody()">ADD ENTRY</button><div style="font-size:10px;color:#666;margin-top:10px;line-height:1.5">Tip: weigh same time daily (morning, after bathroom). Track the weekly trend, not daily noise.</div></div>`;
h+=`<div style="height:8px"></div></div>`;return h;}
function modal(){
const s=sessions[S.workoutMode],e=s.exercises[S.workoutEx],sg=suggest(S.workoutMode,e.name);
let h=`<div class="modal open"><div class="modal-h"><div class="modal-t">${s.name}</div><button class="modal-close" onclick="closeWorkout()">✕ CLOSE</button></div><div class="modal-b"><div class="mono" style="font-size:10px;color:#666;letter-spacing:2px;margin-bottom:10px">Exercise ${S.workoutEx+1} of ${s.exercises.length}</div><div class="modal-en">${e.name}</div><div class="modal-et" style="margin-bottom:${sg?4:16}px">${e.target}</div>`;
if(sg)h+=`<div class="mono" style="font-size:10px;color:${sg.b?GREEN:"#666"};margin-bottom:16px">${sg.b?"▲ Try "+sg.w+"kg (hit all reps last time)":"Last: "+sg.w+"kg"}</div>`;
if(S.timer!==null)h+=`<div style="margin-bottom:12px"><div class="timer-t" style="color:${S.timerVal<=10?GOLD:"#666"}">⏱ Rest: ${S.timerVal}s</div><div class="timer-bar"><div class="timer-fill" style="width:${(S.timerVal/90)*100}%"></div></div></div>`;
for(let si=0;si<e.sets;si++){const ck="modal_"+S.workoutEx+"_"+si;
h+=`<div class="msetrow"><div class="msetn">SET ${si+1}</div><input class="minp" type="number" inputmode="decimal" placeholder="${sg?sg.w+"kg":"kg"}" step="0.5"><input class="minp" style="max-width:80px" type="number" inputmode="numeric" placeholder="×${e.reps}"><button class="mchk ${S.checked[ck]?"done":""}" onclick="toggleChk('${ck}');startTimer()">${S.checked[ck]?"✓":"○"}</button></div>`;}
h+=`<div class="mono" style="font-size:9px;color:#666;text-align:center;margin-top:8px">Tap ✓ to log a set & start the 90s rest timer (beeps when done)</div><div class="mnav">`;
if(S.workoutEx>0)h+=`<button class="mnav-btn" onclick="prevEx()">← PREV</button>`;
if(S.workoutEx<s.exercises.length-1)h+=`<button class="mnav-btn gold" onclick="nextEx()">NEXT →</button>`;
else h+=`<button class="mnav-btn green" onclick="finishWorkout()">FINISH ✓</button>`;
h+=`</div></div></div>`;return h;}
// ACTIONS
function go(t){S.tab=t;render();}
function togglePhase(i){S.openPhases[i]=!S.openPhases[i];render();}
function toggleEx(k){S.openEx[k]=!S.openEx[k];render();}
function setExTab(k,t){S.exTab[k]=t;render();}
function setFilter(f){S.filter=f;render();}
function setLogSession(k){S.logSession=k;S.sets={};S.checked={};render();}
function setVal(ck,f,v){if(!S.sets[ck])S.sets[ck]={};S.sets[ck][f]=v;}
function toggleChk(ck){S.checked[ck]=!S.checked[ck];render();}
function toggleSound(){S.soundOn=!S.soundOn;save();render();}
function prefill(){const s=sessions[S.logSession];s.exercises.forEach((e,ei)=>{const sg=suggest(S.logSession,e.name);if(sg)for(let si=0;si<e.sets;si++){const ck=S.logSession+"_"+ei+"_"+si;if(!S.sets[ck])S.sets[ck]={};S.sets[ck].kg=sg.w;}});render();}
function saveSession(){const s=sessions[S.logSession];s.exercises.forEach((e,ei)=>{let mx=0,hit=true,any=false;for(let si=0;si<e.sets;si++){const ck=S.logSession+"_"+ei+"_"+si;const v=S.sets[ck]||{};const w=parseFloat(v.kg),r=parseInt(v.reps);if(!isNaN(w)){any=true;if(w>mx)mx=w;}if(isNaN(r)||r<e.reps)hit=false;}if(any)S.lastWeights[S.logSession+"_"+e.name]={weight:mx,hitAll:hit};});
S.history.unshift({date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),session:s.name});S.history=S.history.slice(0,20);S.sessionCount++;save();S.sets={};S.checked={};render();alert("Session saved! Weights remembered for next time. 💪");}
function addBody(){const w=parseFloat(document.getElementById("wIn").value);if(isNaN(w)){alert("Enter your weight in kg");return;}const waist=parseFloat(document.getElementById("waistIn").value)||null;S.bodyLog.push({date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"}),ts:Date.now(),weight:w,waist});S.bodyLog=S.bodyLog.slice(-60);save();render();}
function openWorkout(k){S.workoutMode=k;S.workoutEx=0;S.timer=null;render();}
function closeWorkout(){S.workoutMode=null;clearInterval(timerInt);S.timer=null;render();}
function prevEx(){S.workoutEx--;render();}
function nextEx(){S.workoutEx++;render();}
function finishWorkout(){S.sessionCount++;const s=sessions[S.workoutMode];S.history.unshift({date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),session:s.name});S.history=S.history.slice(0,20);save();clearInterval(timerInt);S.timer=null;S.workoutMode=null;render();alert("Workout complete! 💪 Session #"+S.sessionCount+" done.");}
render();
</script>
</body>
</html>
